project_id = "qxnfpnabyytdbzdkklet"

[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.sessions]
inactivity_timeout = "30m"
timebox = "24h"
# FinFlow e multiplataforma: entrar no site nao pode invalidar a sessao do app.
single_per_user = false

[auth.email]
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
email_sent = 4
sms_sent = 8
anonymous_users = 1
token_refresh = 120
sign_in_sign_ups = 20
token_verifications = 30

[functions.create-subscription-checkout]
verify_jwt = true

[functions.sync-subscription]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.mercado-pago-webhook]
verify_jwt = false

[functions.groq-proxy]
verify_jwt = true

[functions.finance-ai]
verify_jwt = true

[functions.send-auth-sms]
verify_jwt = false
