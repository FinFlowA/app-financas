name: Publicar atualizacao do app

on:
  workflow_run:
    workflows: [Security CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: eas-update-preview
  cancel-in-progress: true

jobs:
  publish:
    name: EAS Update - ${{ matrix.label }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: runtime atual
            runtime: 2.0.0-r2
            platform: all
          - label: APK original
            runtime: 2.0.0
            platform: android
    steps:
      - name: Baixar o commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Selecionar runtime do APK
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.expo.runtimeVersion=process.env.TARGET_RUNTIME; fs.writeFileSync(p, JSON.stringify(c, null, 2)+'\n');"

      - name: Publicar no canal preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.workflow_run.head_commit.message }} (${{ matrix.label }})
        run: >-
          npx eas-cli@23.1.0 update
          --branch preview
          --platform ${{ matrix.platform }}
          --environment preview
          --message "$UPDATE_MESSAGE"
          --non-interactive
