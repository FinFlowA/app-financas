name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Padrão de menor privilégio: cada job só recebe o que precisar.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Varredura de segredos (histórico completo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A Action oficial exige licenca em repositorios de organizacoes.
      # O CLI continua open source e preserva a varredura de todo o historico.
      - name: gitleaks (CLI open source)
        shell: bash
        run: |
          set +e
          scan_output="$(
            docker run --rm \
              -e GIT_CONFIG_COUNT=1 \
              -e GIT_CONFIG_KEY_0=safe.directory \
              -e GIT_CONFIG_VALUE_0=/repo \
              -v "$GITHUB_WORKSPACE:/repo" \
              -w /repo \
              ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
              git . --redact --verbose 2>&1
          )"
          scan_status=$?
          set -e

          printf '%s\n' "$scan_output"

          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi

          if ! grep -Eq '[1-9][0-9]* commits scanned' <<< "$scan_output"; then
            echo '::error::O Gitleaks terminou sem comprovar a varredura do historico.'
            exit 1
          fi

  mobile:
    name: App mobile — lint, tipos, testes e segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run security:check
      - run: npm run test:finance-ai
      - run: npm run test:finance-ai-context
      - run: npm run test:finance-ai-state-guard
      - run: npm run test:history-order
      - run: npm run test:money-input
      - run: npm run test:password
      - run: npm run test:mfa
      - run: npm run test:anti-abuse
      - run: npm run test:transaction-completion
      - run: npm run test:plan-trigger
      - run: npm run test:account-deletion
      - run: npm run test:offline-queue
      - run: npm run test:native-compat
      - run: npm run test:release-notes-modal
      - run: npm run test:finn-product-guidance
      - run: npm run test:flow-screens
      - run: npm run test:edge-security
      - run: npm run test:local-demo
      - name: npm audit (informativo — não bloqueia o merge)
        run: npm audit --audit-level=high || true

  web:
    name: Site — lint, testes e build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      - name: npm audit (informativo — não bloqueia o merge)
        run: npm audit --audit-level=high || true

  database:
    name: Banco — migrations num banco vazio e testes SQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # Projeto Supabase descartável dentro do runner, só com as migrations e
      # os testes do repositório: a config de produção (hooks, secrets) não é
      # necessária para o banco. Confirma que as migrations recriam o banco do
      # zero e roda os testes pgTAP de supabase/tests.
      - name: Aplicar as migrations e rodar os testes pgTAP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db" && cd "$RUNNER_TEMP/db"
          supabase init --force > /dev/null
          mkdir -p supabase/migrations supabase/tests
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE"/supabase/tests/*.sql supabase/tests/
          supabase db start
          supabase test db

  eas-update:
    name: EAS Update / ${{ matrix.label }}
    needs: [secret-scan, mobile, web, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: eas-update-preview-${{ matrix.runtime }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: runtime atual
            runtime: 2.0.0-r2
            platform: all
          - label: APK original
            runtime: 2.0.0
            platform: android
    steps:
      - name: Baixar o commit validado
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validar credencial do Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::O segredo EXPO_TOKEN não está configurado em Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Instalar dependências
        run: npm ci
      - name: Selecionar runtime do aplicativo
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.expo.runtimeVersion=process.env.TARGET_RUNTIME; fs.writeFileSync(p, JSON.stringify(c, null, 2)+'\n');"
      - name: Publicar no canal preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }} (${{ matrix.label }})
        run: |
          for attempt in 1 2 3; do
            if npx eas-cli@23.1.0 update \
              --branch preview \
              --platform "${{ matrix.platform }}" \
              --environment preview \
              --message "$UPDATE_MESSAGE" \
              --non-interactive; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::A API do Expo falhou na tentativa $attempt. Nova tentativa em 20 segundos."
              sleep 20
            fi
          done
          echo "::error::Não foi possível publicar no Expo após 3 tentativas."
          exit 1
